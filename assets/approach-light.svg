<text x="272" y="298" class="s">eval</text>
<path class="bline" d="M410 266 V208" marker-end="url(#b)"/>
<path class="bline" d="M410 236 H134 V208" marker-end="url(#b)"/>
<path class="bline" d="M410 236 H616 V208" marker-end="url(#b)"/>
<text x="272" y="228" class="s">updated weights &amp; win-rate signal</text>
</svg>
