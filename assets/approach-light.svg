<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 368" role="img" aria-label="Jace unified architecture. A shared program card encoder turns managym card programs into card embeddings used across all three Limited Magic stages: Draft (8-seat pods and causal transformer), Deck Build (3-stage masked builder and set-transformer deck score), and Play (closed-decklist policy and WDL critic). Play generates trajectories for Self-Play RL (WDL GAE, dual-KL damped loss, even-odds snapshots, and counterfactual forks), which updates weights and win-rate signals back into Draft, Deck Build, and Play and sends checkpoints to Evaluation (mirrored deals, forensics, and adaptive judging).">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328;text-anchor:middle;font-size:15.5px}
.t{font-weight:600}.s{font-size:13px;fill:#59636e}
.line{fill:none;stroke:#1f2328;stroke-width:1.5}.head{fill:#1f2328}
.bline{fill:none;stroke:#3a5bd9;stroke-width:1.5}.bhead{fill:#3a5bd9}
.box{fill:#ffffff;stroke:#b8bec6}.round{fill:#eef2fd;stroke:#3a5bd9}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="bhead"/></marker>
</defs>
<rect class="round" x="24" y="20" width="772" height="64" rx="10"/>
<text x="410" y="47" class="t">Shared Program Card Encoder</text>
<text x="410" y="68" class="s">managym engine card programs → shared card embeddings (no per-card IDs or usage statistics)</text>
<path class="bline" d="M134 84 V118" marker-end="url(#b)"/>
<path class="bline" d="M410 84 V118" marker-end="url(#b)"/>
<path class="bline" d="M686 84 V118" marker-end="url(#b)"/>
<rect class="box" x="24" y="122" width="220" height="82" rx="10"/>
<text x="134" y="152" class="t">1. Draft</text>
<text x="134" y="173" class="s">8-seat booster pods</text>
<text x="134" y="191" class="s">causal transformer picker</text>
<rect class="box" x="300" y="122" width="220" height="82" rx="10"/>
<text x="410" y="152" class="t">2. Deck Build</text>
<text x="410" y="173" class="s">3-stage masked builder</text>
<text x="410" y="191" class="s">set-transformer deck score</text>
<rect class="box" x="576" y="122" width="220" height="82" rx="10"/>
<text x="686" y="152" class="t">3. Play</text>
<text x="686" y="173" class="s">closed-decklist games</text>
<text x="686" y="191" class="s">policy &amp; WDL critic</text>
<path class="line" d="M244 163 H296" marker-end="url(#a)"/>
<text x="272" y="154" class="s">pool</text>
<path class="line" d="M520 163 H572" marker-end="url(#a)"/>
<text x="548" y="154" class="s">deck</text>
<rect class="box" x="24" y="266" width="220" height="82" rx="10"/>
<text x="134" y="296" class="t">Evaluate</text>
<text x="134" y="317" class="s">mirrored deals · forensics</text>
<text x="134" y="335" class="s">adaptive judge · replays</text>
<rect class="round" x="300" y="266" width="496" height="82" rx="10"/>
<text x="548" y="296" class="t">Self-Play RL</text>
<text x="548" y="317" class="s">WDL GAE · dual-KL damped loss</text>
<text x="548" y="335" class="s">even-odds snapshots · counterfactual forks</text>
