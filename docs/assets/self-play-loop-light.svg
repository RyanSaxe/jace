<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 328" role="img" aria-label="Self-play update loop. CPU or sharded collectors (jace.collect) send complete games to WDL GAE Credit (jace.rl.credit), Top-Fraction Filter (jace.rl.select), Size-Bucketed Minibatches with epoch catalog cache, and Damped Dual-KL Loss (jace.rl.losses). Batched Counterfactual Forks (jace.forks.batch) optionally contribute an auxiliary loss. Updated weights return to collectors, and periodic snapshots go to SnapshotPool (jace.rl.pool), which supplies opponents on 25% of updates.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328;text-anchor:middle;font-size:15px}
.t{font-weight:600}.s{font-size:12.5px;fill:#59636e}.l{text-anchor:start}.r{text-anchor:end}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;font-weight:600}
.line{fill:none;stroke:#1f2328;stroke-width:1.5}.head{fill:#1f2328}
.bline{fill:none;stroke:#3a5bd9;stroke-width:1.5}.bhead{fill:#3a5bd9}
.dline{fill:none;stroke:#59636e;stroke-width:1.5;stroke-dasharray:5 3}.dhead{fill:#59636e}
.box{fill:#ffffff;stroke:#b8bec6}.round{fill:#eef2fd;stroke:#3a5bd9}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="bhead"/></marker>
<marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dhead"/></marker>
</defs>
<rect class="box" x="24" y="20" width="200" height="70" rx="10"/>
<text x="124" y="50" class="t">CPU / Sharded Collectors</text>
<text x="124" y="70" class="s">jace.collect</text>
<path class="line" d="M224 55 H336" marker-end="url(#a)"/>
<text x="280" y="46" class="s">complete games</text>
<rect class="box" x="340" y="20" width="182" height="70" rx="10"/>
<text x="431" y="50" class="t">WDL GAE Credit</text>
<text x="431" y="70" class="s">jace.rl.credit</text>
<path class="line" d="M522 55 H568" marker-end="url(#a)"/>
<rect class="box" x="572" y="20" width="224" height="70" rx="10"/>
<text x="684" y="50" class="t">Top-Fraction Filter</text>
<text x="684" y="70" class="s">jace.rl.select</text>
<path class="line" d="M684 90 V130" marker-end="url(#a)"/>
<rect class="box" x="544" y="134" width="252" height="70" rx="10"/>
<text x="670" y="164" class="t">Size-Bucketed Minibatches</text>
<text x="670" y="184" class="s">+ epoch catalog cache</text>
<path class="line" d="M544 169 H512" marker-end="url(#a)"/>
<rect class="round" x="292" y="134" width="216" height="70" rx="10"/>
<text x="400" y="164" class="t">Damped Dual-KL Loss</text>
<text x="400" y="184" class="s">jace.rl.losses</text>
<path class="bline" d="M292 169 H168 V94" marker-end="url(#b)"/>
<text x="230" y="160" class="s">updated weights</text>
<rect class="box" x="24" y="242" width="200" height="66" rx="10"/>
<text x="124" y="271" class="m">SnapshotPool</text>
<text x="124" y="291" class="s">jace.rl.pool</text>
<path class="line" d="M366 204 V275 H228" marker-end="url(#a)"/>
<text x="297" y="293" class="s">periodic snapshot</text>
<path class="line" d="M62 242 V94" marker-end="url(#a)"/>
<text x="72" y="164" class="s l">25% of</text>
<text x="72" y="181" class="s l">updates</text>
<rect class="box" x="544" y="242" width="252" height="66" rx="10"/>
<text x="670" y="271" class="t">Batched Counterfactual Forks</text>
<text x="670" y="291" class="s">jace.forks.batch</text>
<path class="dline" d="M544 275 H430 V208" marker-end="url(#d)"/>
<text x="487" y="293" class="s">optional aux loss</text>
</svg>
