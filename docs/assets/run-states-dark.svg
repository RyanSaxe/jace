<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 586 286" role="img" aria-label="The states of a run. A run is created, then running. From running it becomes completed when the writing block ends, failed on an error, or interrupted on Ctrl-C or when the process is killed. An interrupted run can resume to running. Completed and failed are final.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328;text-anchor:middle;font-size:16px}
.t{font-weight:600}.s{font-size:13.5px;fill:#59636e}.l{text-anchor:start}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:600}
.line{fill:none;stroke:#1f2328;stroke-width:1.5}.head{fill:#1f2328}
.box{fill:#ffffff;stroke:#b8bec6}.round{fill:#eef2fd;stroke:#3a5bd9}.side{fill:none;stroke:#8c959f;stroke-dasharray:4 3}
text{fill:#e6edf3}.s{fill:#9198a1}.line{stroke:#e6edf3}.head{fill:#e6edf3}.box{fill:#0d1117;stroke:#3d444d}.round{fill:#152042;stroke:#6e8cf0}.side{stroke:#656c76}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect class="box" x="18" y="100" width="130" height="50" rx="10"/>
<text x="83" y="130" class="t">created</text>
<rect class="round" x="218" y="100" width="130" height="50" rx="10"/>
<text x="283" y="130" class="t">running</text>
<rect class="box" x="438" y="18" width="130" height="50" rx="10"/>
<text x="503" y="48" class="t">completed</text>
<rect class="box" x="438" y="100" width="130" height="50" rx="10"/>
<text x="503" y="130" class="t">failed</text>
<rect class="box" x="438" y="182" width="130" height="50" rx="10"/>
<text x="503" y="212" class="t">interrupted</text>
<path class="line" d="M148 125 H214" marker-end="url(#a)"/>
<text x="183" y="115" class="s">start</text>
<path class="line" d="M348 112 C398 112 378 43 434 43" marker-end="url(#a)"/>
<text x="424" y="30" class="s" style="text-anchor:end">block ends</text>
<path class="line" d="M348 125 H434" marker-end="url(#a)"/>
<text x="424" y="115" class="s" style="text-anchor:end">error</text>
<path class="line" d="M348 138 C398 138 378 207 434 207" marker-end="url(#a)"/>
<text x="424" y="228" class="s" style="text-anchor:end">Ctrl-C or killed</text>
<path class="line" d="M503 232 V266 H283 V154" marker-end="url(#a)"/>
<text x="393" y="258" class="s">resume</text>
</svg>
