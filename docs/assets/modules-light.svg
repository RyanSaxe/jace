<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="seam-head"/></marker>
</defs>
<rect class="round" x="18" y="18" width="288" height="58" rx="10"/>
<text x="162" y="43" class="m">jace.train</text>
<text x="162" y="63" class="s">full_data, ten_decks, harness</text>
