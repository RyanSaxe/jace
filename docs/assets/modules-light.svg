<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 448" role="img" aria-label="Package layers of jace. Imports flow strictly down the DAG and right-to-left within a row. Row 1: jace.train (gameplay self-play CLIs) and jace.pretrain (supervised pretraining CLIs and helpers). Row 2: jace.forks imports jace.eval which imports jace.collect (right-to-left). Row 3: jace.storage.gameplay (checkpoints, replays, resume; TYPE_CHECKING refs to jace.rl) and jace.storage.pretrain (locked pretraining records). Row 4: jace.rl (pure-tensor RL math and loop), jace.draft (pods and drafter), and jace.decks (builder, score, search). Row 5 foundation leaves: jace.data imports jace.cards which imports jace.modules (right-to-left). On the right: managym and manabot runtime, connected via the blue seam bracket spanning the blue-highlighted seam packages.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328;text-anchor:middle;font-size:15px}
.t{font-weight:600}.s{font-size:12.5px;fill:#59636e}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:600}
.line{fill:none;stroke:#1f2328;stroke-width:1.5}.head{fill:#1f2328}
.seam{fill:none;stroke:#3a5bd9;stroke-width:1.6}.seam-head{fill:#3a5bd9}
.box{fill:#ffffff;stroke:#b8bec6}.round{fill:#eef2fd;stroke:#3a5bd9}.side{fill:none;stroke:#8c959f;stroke-dasharray:4 3}
</style>
<defs>
