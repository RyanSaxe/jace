<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 444" role="img" aria-label="Package layers of jace. Row 1: jace.train (gameplay self-play CLIs) and jace.pretrain (supervised pretraining CLIs and helpers). Row 2: jace.collect (agent factory, decks, collectors), jace.eval (mirrored deals, forensics, diffs), and jace.forks (counterfactual forks and audits). Row 3: jace.rl (pure-tensor RL math and loop), jace.draft (pods and drafter), and jace.decks (builder, score, search). Row 4: jace.storage.gameplay (checkpoints, replays, resume) and jace.storage.pretrain (locked pretraining records). Row 5 foundation leaves: jace.cards (program card encoder), jace.data (17Lands and engine catalog), and jace.modules (transformers and device selection). On the right: managym and manabot runtime, accessed through the blue-highlighted seam packages.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328;text-anchor:middle;font-size:15px}
.t{font-weight:600}.s{font-size:12.5px;fill:#59636e}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:600}
.line{fill:none;stroke:#1f2328;stroke-width:1.5}.head{fill:#1f2328}
.box{fill:#ffffff;stroke:#b8bec6}.round{fill:#eef2fd;stroke:#3a5bd9}.side{fill:none;stroke:#8c959f;stroke-dasharray:4 3}
</style>
