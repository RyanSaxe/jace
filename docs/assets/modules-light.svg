<text x="410" y="404" class="s">Imports flow strictly down the DAG (and right-to-left within a row).</text>
<text x="410" y="424" class="s">Blue boxes mark the seam to managym and manabot (train, collect, eval, forks, storage.gameplay, rl.loop, data.catalog).</text>
</svg>
