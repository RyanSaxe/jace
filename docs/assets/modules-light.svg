<path class="line" d="M430 121 H409" marker-end="url(#a)"/>
<path class="line" d="M224 121 H203" marker-end="url(#a)"/>
<rect class="round" x="18" y="166" width="288" height="58" rx="10"/>
<text x="162" y="191" class="m">jace.storage.gameplay</text>
<text x="162" y="211" class="s">checkpoints, replays &amp; resume</text>
<rect class="box" x="324" y="166" width="288" height="58" rx="10"/>
<text x="468" y="191" class="m">jace.storage.pretrain</text>
