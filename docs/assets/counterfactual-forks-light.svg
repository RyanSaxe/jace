<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 264" role="img" aria-label="Batched counterfactual forks pipeline. Step 1 Harvest Roots selects states with matching decision kinds and at least 2 legal actions. Step 2 Clone Engine forces the top-2 actions (a0, a1) across R paired CRN playouts. Step 3 Batched Rollout plays full games or an audited value-head horizon, feeding decisive forks (|q0 - q1| &gt;= min_gap) into Pairwise CE on (a0, a1) plus All-Action Anchor KL, and reservoir states into Auxiliary WDL Value Supervision.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328;text-anchor:middle;font-size:15px}
.t{font-weight:600}.s{font-size:12.5px;fill:#59636e}.l{text-anchor:start}.r{text-anchor:end}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;font-weight:600}
.line{fill:none;stroke:#1f2328;stroke-width:1.5}.head{fill:#1f2328}
.bline{fill:none;stroke:#3a5bd9;stroke-width:1.5}.bhead{fill:#3a5bd9}
.dline{fill:none;stroke:#59636e;stroke-width:1.5;stroke-dasharray:5 3}.dhead{fill:#59636e}
.box{fill:#ffffff;stroke:#b8bec6}.round{fill:#eef2fd;stroke:#3a5bd9}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="bhead"/></marker>
<marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dhead"/></marker>
</defs>
<rect class="box" x="24" y="20" width="236" height="80" rx="10"/>
<text x="142" y="48" class="t">1. Harvest Roots</text>
<text x="142" y="69" class="s">matching decision kinds</text>
<text x="142" y="87" class="s">≥ 2 legal actions</text>
<path class="line" d="M260 60 H288" marker-end="url(#a)"/>
<rect class="round" x="292" y="20" width="236" height="80" rx="10"/>
<text x="410" y="48" class="t">2. Clone Engine</text>
<text x="410" y="69" class="s">force top-2 actions (a0, a1)</text>
<text x="410" y="87" class="s">R paired CRN playouts</text>
<path class="line" d="M528 60 H556" marker-end="url(#a)"/>
<rect class="box" x="560" y="20" width="236" height="80" rx="10"/>
<text x="678" y="48" class="t">3. Batched Rollout</text>
<text x="678" y="69" class="s">full game or audited</text>
<text x="678" y="87" class="s">value-head horizon</text>
<path class="line" d="M678 100 V160" marker-end="url(#a)"/>
<text x="688" y="136" class="s l">reservoir states</text>
<path class="line" d="M678 124 H142 V160" marker-end="url(#a)"/>
<rect class="box" x="24" y="164" width="236" height="80" rx="10"/>
<text x="142" y="198" class="t">Decisive Fork Filter</text>
<text x="142" y="220" class="s">|q0 - q1| ≥ min_gap</text>
<path class="line" d="M260 204 H288" marker-end="url(#a)"/>
<rect class="round" x="292" y="164" width="236" height="80" rx="10"/>
<text x="410" y="198" class="t">Pairwise CE on (a0, a1)</text>
<text x="410" y="220" class="s">+ All-Action Anchor KL</text>
<rect class="round" x="560" y="164" width="236" height="80" rx="10"/>
<text x="678" y="198" class="t">Auxiliary WDL</text>
<text x="678" y="220" class="s">Value Supervision</text>
</svg>
