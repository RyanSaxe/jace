<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 378" role="img" aria-label="End-to-end data and model flow in jace. The managym Card Catalog feeds engine programs into the Program Card Encoder (jace.cards and ActorCritic), which supplies card embeddings to Drafter (jace.draft), Deck Builder and Score (jace.decks), and Gameplay Policy and Critic (jace.collect and jace.rl). Drafter outputs a 42-card pool to Deck Builder and Score, which outputs a 40-card deck to Gameplay Policy and Critic, which sends trajectories and outcomes to Self-Play RL (jace.rl). Self-Play RL feeds weights and win-rate signals back to Drafter and Deck Builder, weights and snapshots back to Gameplay Policy, and checkpoints to Mirrored Evaluation (jace.eval), which writes to Run Storage (jace.storage).">
