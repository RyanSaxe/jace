<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 384" role="img" aria-label="Package layers of jace. Top row: jace.loops (CLI training, pretraining, collector pool, forks, screening). Second row: jace.rl (GAE, losses, snapshots, loop), jace.eval (mirrored deals, forensics, diffs), jace.draft (booster pods and drafter), and jace.decks (builder, score, and search). Third row: jace.runs (gameplay checkpoints and replays) and jace.tracking (locked pretraining run records). Bottom foundation row: jace.cards (card pool and program encoder), jace.data (17Lands loaders and engine catalog), and jace.modules (packed transformers). On the right: managym and manabot runtime, accessed through the blue-highlighted seam modules.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3;text-anchor:middle;font-size:15.5px}
.t{font-weight:600}.s{font-size:13px;fill:#9198a1}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14.5px;font-weight:600}
.line{fill:none;stroke:#e6edf3;stroke-width:1.5}.head{fill:#e6edf3}
.box{fill:#0d1117;stroke:#3d444d}.round{fill:#152042;stroke:#6e8cf0}.side{fill:none;stroke:#59636e;stroke-dasharray:4 3}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect class="round" x="18" y="18" width="596" height="60" rx="10"/>
<text x="316" y="44" class="m">jace.loops</text>
<text x="316" y="65" class="s">CLI entry points, multi-process collection, batched forks, screening, pretraining</text>
<rect class="round" x="18" y="96" width="138" height="62" rx="10"/>
<text x="87" y="123" class="m">jace.rl</text>
<text x="87" y="144" class="s">GAE, losses &amp; loop</text>
<rect class="round" x="171" y="96" width="138" height="62" rx="10"/>
<text x="240" y="123" class="m">jace.eval</text>
<text x="240" y="144" class="s">deals &amp; forensics</text>
<rect class="box" x="324" y="96" width="138" height="62" rx="10"/>
<text x="393" y="123" class="m">jace.draft</text>
<text x="393" y="144" class="s">pods &amp; drafter</text>
<rect class="box" x="476" y="96" width="138" height="62" rx="10"/>
<text x="545" y="123" class="m">jace.decks</text>
<text x="545" y="144" class="s">builder &amp; score</text>
<rect class="round" x="18" y="176" width="291" height="60" rx="10"/>
<text x="163" y="202" class="m">jace.runs</text>
<text x="163" y="223" class="s">gameplay checkpoints, replays &amp; resume</text>
<rect class="box" x="324" y="176" width="290" height="60" rx="10"/>
<text x="469" y="202" class="m">jace.tracking</text>
<text x="469" y="223" class="s">locked pretraining run records</text>
<rect class="box" x="18" y="254" width="189" height="62" rx="10"/>
<text x="112" y="281" class="m">jace.cards</text>
<text x="112" y="302" class="s">program card encoder</text>
<rect class="round" x="222" y="254" width="189" height="62" rx="10"/>
<text x="316" y="281" class="m">jace.data</text>
<text x="316" y="302" class="s">17Lands &amp; catalog</text>
<rect class="box" x="426" y="254" width="188" height="62" rx="10"/>
<text x="520" y="281" class="m">jace.modules</text>
<text x="520" y="302" class="s">packed transformers</text>
<rect class="side" x="646" y="18" width="156" height="298" rx="10"/>
<text x="724" y="122" class="t">managym /</text>
<text x="724" y="142" class="t">manabot</text>
<text x="724" y="172" class="s">Rust rules engine</text>
<text x="724" y="191" class="s">card program catalog</text>
<text x="724" y="210" class="s">ActorCritic &amp; v11 obs</text>
<text x="724" y="229" class="s">rollouts &amp; Academy</text>
<path class="line" d="M614 48 H642" marker-end="url(#a)"/>
<text x="410" y="348" class="s">Imports flow downward only. Blue boxes mark the narrow engine seam</text>
<text x="410" y="368" class="s">(jace.loops, jace.rl.loop, jace.eval, jace.runs, and jace.data.catalog).</text>
