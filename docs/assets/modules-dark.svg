<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 418" role="img" aria-label="The modules of jace in rows, where a module imports only from the rows below it. Top: jace.loops. Then jace.draft, jace.decks, jace.train and jace.eval. Then jace.play. Then jace.engine, whose adapter is the only code that imports manabot. At the bottom, jace.cards. jace.tracking stands alone. jace.engine is drawn in blue because it is the only way games are played.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328;text-anchor:middle;font-size:16px}
.t{font-weight:600}.s{font-size:13.5px;fill:#59636e}.l{text-anchor:start}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:600}
.line{fill:none;stroke:#1f2328;stroke-width:1.5}.head{fill:#1f2328}
.box{fill:#ffffff;stroke:#b8bec6}.round{fill:#eef2fd;stroke:#3a5bd9}.side{fill:none;stroke:#8c959f;stroke-dasharray:4 3}
text{fill:#e6edf3}.s{fill:#9198a1}.line{stroke:#e6edf3}.head{fill:#e6edf3}.box{fill:#0d1117;stroke:#3d444d}.round{fill:#152042;stroke:#6e8cf0}.side{stroke:#656c76}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect class="box" x="18" y="18" width="560" height="58" rx="10"/>
<text x="298" y="44" class="m">jace.loops</text>
<text x="298" y="64" class="s">example loops and schedules</text>
<rect class="box" x="18" y="92" width="128" height="58" rx="10"/>
<text x="82" y="126" class="m">jace.draft</text>
<rect class="box" x="162" y="92" width="128" height="58" rx="10"/>
<text x="226" y="126" class="m">jace.decks</text>
<rect class="box" x="306" y="92" width="128" height="58" rx="10"/>
<text x="370" y="126" class="m">jace.train</text>
<rect class="box" x="450" y="92" width="128" height="58" rx="10"/>
<text x="514" y="126" class="m">jace.eval</text>
<rect class="box" x="18" y="166" width="560" height="58" rx="10"/>
<text x="298" y="192" class="m">jace.play</text>
<text x="298" y="212" class="s">the guess model and the player</text>
<rect class="round" x="18" y="240" width="560" height="58" rx="10"/>
<text x="298" y="266" class="m">jace.engine</text>
<text x="298" y="286" class="s">GameBatch, and the manabot adapter</text>
<rect class="box" x="18" y="314" width="560" height="58" rx="10"/>
<text x="298" y="340" class="m">jace.cards</text>
<text x="298" y="360" class="s">card records and the card embedding</text>
<rect class="side" x="622" y="240" width="150" height="58" rx="10"/>
<text x="697" y="266" class="t">manabot</text>
<text x="697" y="286" class="s">the game engine</text>
<path class="line" d="M578 269 H618" marker-end="url(#a)"/>
<rect class="box" x="622" y="18" width="150" height="58" rx="10"/>
<text x="697" y="44" class="m">jace.tracking</text>
<text x="697" y="64" class="s">stands alone</text>
<text x="298" y="402" class="s">A module imports only from the rows below it.</text>
</svg>
