<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 204" role="img" aria-label="DrafterModel forward pass. Earlier Picks (picked card, mean pack, and position) and the Current Pack Query (learned query, mean pack, and position) enter the Causal Transformer (DrafterModel), whose output takes a Scaled Dot Product with candidate(card_vec) and masks cards outside the current pack with negative infinity to produce pick logits.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3;text-anchor:middle;font-size:15px}
.t{font-weight:600}.s{font-size:12.5px;fill:#9198a1}.l{text-anchor:start}.r{text-anchor:end}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;font-weight:600}
.line{fill:none;stroke:#e6edf3;stroke-width:1.5}.head{fill:#e6edf3}
.bline{fill:none;stroke:#6e8cf0;stroke-width:1.5}.bhead{fill:#6e8cf0}
.dline{fill:none;stroke:#9198a1;stroke-width:1.5;stroke-dasharray:5 3}.dhead{fill:#9198a1}
.box{fill:#0d1117;stroke:#3d444d}.round{fill:#152042;stroke:#6e8cf0}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="bhead"/></marker>
<marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dhead"/></marker>
</defs>
<rect class="box" x="20" y="20" width="198" height="68" rx="10"/>
<text x="119" y="48" class="t">Earlier Picks</text>
<text x="119" y="68" class="s">picked + mean pack + pos</text>
<rect class="box" x="20" y="116" width="198" height="68" rx="10"/>
<text x="119" y="144" class="t">Current Pack Query</text>
<text x="119" y="164" class="s">query + mean pack + pos</text>
<path class="line" d="M218 54 C236 54 234 90 248 90 H256" marker-end="url(#a)"/>
<path class="line" d="M218 150 C236 150 234 114 248 114 H256" marker-end="url(#a)"/>
<rect class="round" x="260" y="66" width="164" height="72" rx="10"/>
<text x="342" y="98" class="t">Causal Transformer</text>
<text x="342" y="118" class="s">DrafterModel</text>
<path class="line" d="M424 102 H446" marker-end="url(#a)"/>
<rect class="box" x="450" y="66" width="164" height="72" rx="10"/>
<text x="532" y="98" class="t">Scaled Dot Product</text>
<text x="532" y="118" class="s">candidate(card_vec)</text>
<path class="line" d="M614 102 H636" marker-end="url(#a)"/>
<rect class="box" x="640" y="66" width="160" height="72" rx="10"/>
<text x="720" y="98" class="t">Mask Outside Pack</text>
<text x="720" y="118" class="s">(-inf) → Pick Logits</text>
</svg>
