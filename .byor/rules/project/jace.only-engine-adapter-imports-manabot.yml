id: jace.only-engine-adapter-imports-manabot
language: Python
severity: error
message: Only src/jace/engine/manabot.py and src/jace/engine/scoring.py may import manabot or managym.
ignores:
  - src/jace/engine/manabot.py
  - src/jace/engine/scoring.py
rule:
  any:
    - kind: import_from_statement
      has:
        field: module_name
        regex: ^(manabot|managym)(\.|$)
    - kind: import_statement
      has:
        any:
          - kind: dotted_name
            regex: ^(manabot|managym)(\.|$)
          - kind: aliased_import
            has:
              kind: dotted_name
              regex: ^(manabot|managym)(\.|$)
metadata:
  byor:
    rationale: >
      The engine, managym, and manabot's players and rating code sit behind
      jace.engine so that training, evaluation and tests never depend on
      either package, and a change in one touches two files: the batched
      adapter that training plays through, and the scalar games that
      scoring plays against manabot's scripted players.
    agent_prompt: >
      Do not import manabot or managym here. Use the types in jace.engine
      (GameBatch, BoardLayout, Decisions, Finished, HiddenCards, Outcome). If you need
      something new from the engine, add it to the GameBatch interface and
      implement it in src/jace/engine/manabot.py, or, for scoring a match
      between two players, add it to src/jace/engine/scoring.py.
    tags:
      - python
      - jace
      - boundaries
