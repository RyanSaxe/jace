id: jace.pure-rl-math-boundaries
language: Python
severity: error
message: Pure RL modules (credit, losses, select) must not import Limited domain packages, eval, runs, or loops.
files:
  - src/jace/rl/credit.py
  - src/jace/rl/losses.py
  - src/jace/rl/select.py
rule:
  any:
    - kind: import_from_statement
      has:
        field: module_name
        regex: ^jace\.(cards|data|draft|decks|eval|runs|tracking|loops)(\.|$)
    - kind: import_statement
      has:
        any:
          - kind: dotted_name
            regex: ^jace\.(cards|data|draft|decks|eval|runs|tracking|loops)(\.|$)
          - kind: aliased_import
            has:
              kind: dotted_name
              regex: ^jace\.(cards|data|draft|decks|eval|runs|tracking|loops)(\.|$)
metadata:
  byor:
    rationale: >
      Keeping jace.rl.credit, losses, and select as pure tensor functions makes
      every RL algorithm easy to read, teach, swap, and test on synthetic
      batches with zero engine or dataset dependencies.
    agent_prompt: >
      Keep this module pure PyTorch/NumPy math. Accept tensors or small local
      dataclasses as parameters instead of importing domain or loop modules.
    tags:
      - python
      - jace
      - boundaries
