id: jace.nothing-imports-pretrain
language: Python
severity: error
message: Nothing outside jace.pretrain may import jace.pretrain; pretraining loops are top-level wiring only.
files:
  - src/jace/**/*.py
ignores:
  - src/jace/pretrain/**
rule:
  any:
    - kind: import_from_statement
      has:
        field: module_name
        regex: ^jace\.pretrain(\.|$)
    - kind: import_statement
      has:
        any:
          - kind: dotted_name
            regex: ^jace\.pretrain(\.|$)
          - kind: aliased_import
            has:
              kind: dotted_name
              regex: ^jace\.pretrain(\.|$)
metadata:
  byor:
    rationale: >
      jace.pretrain is a top-level wiring package that connects data, cards,
      draft, decks, and pretraining storage into runnable supervised entry
      points. Keeping other packages independent of jace.pretrain preserves
      clean modularity.
    agent_prompt: >
      Move any shared helper that other packages need into the appropriate
      lower-layer package instead of importing from jace.pretrain.
    tags:
      - python
      - jace
      - boundaries
