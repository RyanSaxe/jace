id: jace.nothing-imports-train
language: Python
severity: error
message: Nothing outside jace.train may import jace.train; gameplay training CLIs are top-level wiring only.
files:
  - src/jace/**/*.py
ignores:
  - src/jace/train/**
rule:
  any:
    - kind: import_from_statement
      has:
        field: module_name
        regex: ^jace\.train(\.|$)
    - kind: import_statement
      has:
        any:
          - kind: dotted_name
            regex: ^jace\.train(\.|$)
          - kind: aliased_import
            has:
              kind: dotted_name
              regex: ^jace\.train(\.|$)
metadata:
  byor:
    rationale: >
      jace.train is the top layer that connects RL, collection, evaluation,
      forks, and gameplay storage into runnable self-play CLIs. Keeping lower
      packages independent of jace.train preserves clean modularity.
    agent_prompt: >
      Move any shared helper that lower packages need into the appropriate
      lower-layer package instead of importing from jace.train.
    tags:
      - python
      - jace
      - boundaries
