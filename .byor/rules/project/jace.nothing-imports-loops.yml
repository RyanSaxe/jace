id: jace.nothing-imports-loops
language: Python
severity: error
message: Nothing outside jace.loops may import jace.loops; loops are top-level wiring only.
files:
  - src/jace/**/*.py
ignores:
  - src/jace/loops/**
rule:
  any:
    - kind: import_from_statement
      has:
        field: module_name
        regex: ^jace\.loops(\.|$)
    - kind: import_statement
      has:
        any:
          - kind: dotted_name
            regex: ^jace\.loops(\.|$)
          - kind: aliased_import
            has:
              kind: dotted_name
              regex: ^jace\.loops(\.|$)
metadata:
  byor:
    rationale: >
      jace.loops is the top layer that connects data, models, RL, and
      evaluation into runnable entry points. Keeping lower modules independent
      of jace.loops preserves clean modularity.
    agent_prompt: >
      Move any shared helper that lower packages need into the appropriate
      lower-layer package instead of importing from jace.loops.
    tags:
      - python
      - jace
      - boundaries
