id: jace.only-entry-points-import-draft
language: Python
severity: error
message: Only jace.pretrain and jace.train may import jace.draft, so constructed play needs no drafting code.
files:
  - src/jace/**/*.py
ignores:
  - src/jace/draft/**
  - src/jace/pretrain/**
  - src/jace/train/**
rule:
  any:
    - kind: import_from_statement
      has:
        field: module_name
        regex: ^jace\.draft(\.|$)
    - kind: import_statement
      has:
        any:
          - kind: dotted_name
            regex: ^jace\.draft(\.|$)
          - kind: aliased_import
            has:
              kind: dotted_name
              regex: ^jace\.draft(\.|$)
metadata:
  byor:
    rationale: >
      Constructed play is the same code with the drafter left out. That holds
      only while decks, rl, collect, eval, forks, and storage do not depend on
      jace.draft. Both jace.pretrain and jace.train may import jace.draft so
      supervised pretraining and joint Limited self-play can wire the drafter.
    agent_prompt: >
      Do not import jace.draft from this module. Shared card types (CardId,
      Pool, Deck) live in jace.cards. If this code needs draft results, take
      them as plain arguments such as pools or tensors, and let an entry point
      in jace.pretrain or jace.train pass them in.
    tags:
      - python
      - jace
      - boundaries
